<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Après Studio — Sistema de gestión</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f2ef}
    iframe{display:block;width:100%;height:100%;border:0;background:#f5f2ef}
  </style>
</head>
<body>
  <iframe id="app" src="version-2.html?v=f9b3b8" title="Après Studio — Sistema de gestión"></iframe>
  <script>
    const frame=document.getElementById('app');
    frame.addEventListener('load',()=>{
      try{
        const doc=frame.contentDocument;
        doc.title='Après Studio — Sistema de gestión';
        const heading=doc.querySelector('.top h1');
        const subtitle=doc.querySelector('.top h1 + div');
        if(heading) heading.textContent='Après Studio';
        if(subtitle) subtitle.textContent='Sistema de gestión';
        const style=doc.createElement('style');
        style.textContent=`
          body{background:linear-gradient(135deg,#eee9e4,#f8f5f2 52%,#ece7e2)!important}
          .top h1{letter-spacing:-.7px;margin-bottom:4px}
          .top h1+div{color:#6b6865!important;font-size:15px}
        `;
        doc.head.appendChild(style);
      }catch(e){console.warn('No se pudo personalizar la vista',e)}
    });
  </script>
</body>
</html>
